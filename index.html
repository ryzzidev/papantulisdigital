<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#109c6b" />
  <title>Papan Tulis Digital</title>
  
  <!-- PWA Manifest & Logo -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="https://files.catbox.moe/2ovfx4.png" />
  <link rel="apple-touch-icon" href="https://files.catbox.moe/2ovfx4.png" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- CSS Eksternal -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app-stage">
    <!-- Menu Kiri Atas: Undo & Redo -->
    <div class="absolute top-4 left-4 z-50 flex items-center gap-1 px-2 py-1 rounded-full liquid-glass-pill">
      <button
        id="undo-btn"
        title="Undo"
        disabled
        class="p-1.5 rounded-full text-slate-800 hover:bg-white/40 active:scale-95 disabled:opacity-30 disabled:pointer-events-none transition"
      >
        <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 14 4 9l5-5" />
          <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" />
        </svg>
      </button>
      <div class="w-[1px] h-4 bg-slate-800/15"></div>
      <button
        id="redo-btn"
        title="Redo"
        disabled
        class="p-1.5 rounded-full text-slate-800 hover:bg-white/40 active:scale-95 disabled:opacity-30 disabled:pointer-events-none transition"
      >
        <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 14 5-5-5-5" />
          <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13" />
        </svg>
      </button>
    </div>

    <!-- Menu Kanan Atas: Grid, Rotasi, Simpan, Fullscreen -->
    <div class="absolute top-4 right-4 z-50 flex items-center gap-1 px-2 py-1 rounded-full liquid-glass-pill">
      <button
        id="grid-toggle-btn"
        title="Ganti Pola Latar"
        class="p-1.5 rounded-full text-slate-800 hover:bg-white/40 active:scale-95 transition flex items-center gap-1"
      >
        <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <path d="M3 9h18" />
          <path d="M3 15h18" />
          <path d="M9 3v18" />
          <path d="M15 3v18" />
        </svg>
        <span id="grid-label" class="text-[11px] font-semibold hidden md:inline pr-1">Polos</span>
      </button>

      <div class="w-[1px] h-4 bg-slate-800/15"></div>

      <button
        id="rotate-toggle-btn"
        title="Putar Orientasi Layar"
        class="p-1.5 rounded-full text-slate-800 hover:bg-white/40 active:scale-95 transition flex items-center gap-1"
      >
        <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
          <path d="M16 16h5v5" />
        </svg>
      </button>

      <div class="w-[1px] h-4 bg-slate-800/15"></div>

      <button
        id="save-img-btn"
        title="Simpan Papan Tulis (PNG)"
        class="p-1.5 rounded-full text-slate-800 hover:bg-white/40 active:scale-95 transition flex items-center gap-1"
      >
        <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        <span class="text-[11px] font-semibold hidden md:inline pr-1">Simpan</span>
      </button>

      <div class="w-[1px] h-4 bg-slate-800/15"></div>

      <button
        id="fullscreen-btn"
        title="Mode Layar Penuh"
        class="p-1.5 rounded-full text-slate-800 hover:bg-white/40 active:scale-95 transition"
      >
        <svg id="fullscreen-icon" class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 3 21 3 21 9" />
          <polyline points="9 21 3 21 3 15" />
          <line x1="21" y1="3" x2="14" y2="10" />
          <line x1="3" y1="21" x2="10" y2="14" />
        </svg>
      </button>
    </div>

    <!-- Papan Tulis -->
    <div id="board-wrapper">
      <canvas id="whiteboard"></canvas>
      <div id="sticky-container"></div>

      <div id="text-input-overlay">
        <textarea
          id="floating-textarea"
          rows="1"
          placeholder="Ketik teks di sini..."
        ></textarea>
        <div class="flex items-center gap-1.5 mt-1.5">
          <button
            id="confirm-text-btn"
            class="px-2.5 py-1 text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg shadow-sm transition"
          >
            Selesai
          </button>
          <button
            id="cancel-text-btn"
            class="px-2.5 py-1 text-xs font-medium text-slate-700 bg-white/80 hover:bg-white rounded-lg border border-slate-200 transition"
          >
            Batal
          </button>
        </div>
      </div>
    </div>

    <!-- Popover Warna -->
    <div
      id="color-popover"
      class="absolute bottom-[68px] left-1/2 -translate-x-1/2 z-50 hidden px-3.5 py-2.5 rounded-2xl liquid-glass flex items-center gap-2.5 transition-all"
    >
      <button class="color-swatch w-6 h-6 rounded-full border-2 border-white shadow-sm scale-110" style="background:#111827" data-color="#111827"></button>
      <button class="color-swatch w-6 h-6 rounded-full border-2 border-white shadow-sm" style="background:#059669" data-color="#059669"></button>
      <button class="color-swatch w-6 h-6 rounded-full border-2 border-white shadow-sm" style="background:#2563eb" data-color="#2563eb"></button>
      <button class="color-swatch w-6 h-6 rounded-full border-2 border-white shadow-sm" style="background:#dc2626" data-color="#dc2626"></button>
      <button class="color-swatch w-6 h-6 rounded-full border-2 border-white shadow-sm" style="background:#d97706" data-color="#d97706"></button>
      <button class="color-swatch w-6 h-6 rounded-full border-2 border-white shadow-sm" style="background:#7c3aed" data-color="#7c3aed"></button>
      <label class="w-6 h-6 rounded-full border-2 border-white shadow-sm overflow-hidden cursor-pointer flex items-center justify-center bg-gradient-to-tr from-pink-500 via-amber-400 to-emerald-400" title="Warna Kustom">
        <input type="color" id="custom-color-picker" value="#111827" class="opacity-0 w-0 h-0" />
      </label>
    </div>

    <!-- Popover Bentuk -->
    <div
      id="shape-popover"
      class="absolute bottom-[68px] left-1/2 -translate-x-1/2 z-50 hidden px-3 py-2 rounded-2xl liquid-glass flex items-center gap-1.5 transition-all"
    >
      <button class="shape-option px-2.5 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-semibold flex items-center gap-1" data-shape="line">
        <span>╱</span> Garis
      </button>
      <button class="shape-option px-2.5 py-1.5 rounded-xl hover:bg-white/50 text-slate-800 text-xs font-semibold flex items-center gap-1" data-shape="arrow">
        <span>↗</span> Panah
      </button>
      <button class="shape-option px-2.5 py-1.5 rounded-xl hover:bg-white/50 text-slate-800 text-xs font-semibold flex items-center gap-1" data-shape="rect">
        <span>□</span> Kotak
      </button>
      <button class="shape-option px-2.5 py-1.5 rounded-xl hover:bg-white/50 text-slate-800 text-xs font-semibold flex items-center gap-1" data-shape="circle">
        <span>○</span> Lingkaran
      </button>
      <button class="shape-option px-2.5 py-1.5 rounded-xl hover:bg-white/50 text-slate-800 text-xs font-semibold flex items-center gap-1" data-shape="triangle">
        <span>△</span> Segitiga
      </button>
    </div>

    <!-- Dock Menu Bawah -->
    <div class="absolute bottom-2 left-1/2 -translate-x-1/2 z-50 w-[calc(100%-20px)] max-w-[1160px]">
      <div class="liquid-glass rounded-full px-2.5 py-1 flex items-center justify-between gap-2 overflow-x-auto no-scrollbar">
        <div class="flex items-center gap-1 shrink-0">
          <button class="tool-btn active" data-tool="pen">
            <svg class="w-4 h-4 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19l7-7 3 3-7 7-3-3z" />
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
              <path d="M2 2l7.586 7.586" />
            </svg>
            <span class="text-[10px] font-semibold tracking-tight">Pena</span>
          </button>

          <button class="tool-btn" data-tool="pencil">
            <svg class="w-4 h-4 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m18 2 4 4L7 21H3v-4L18 2z" />
              <path d="m15 5 4 4" />
            </svg>
            <span class="text-[10px] font-semibold tracking-tight">Pensil</span>
          </button>

          <button class="tool-btn" data-tool="marker">
            <svg class="w-4 h-4 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m14.5 2-12.5 12.5v5.5h5.5l12.5-12.5z" />
              <path d="m12 6 6 6" />
            </svg>
            <span class="text-[10px] font-semibold tracking-tight">Spidol</span>
          </button>

          <button class="tool-btn" data-tool="brush">
            <svg class="w-4 h-4 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08" />
              <path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z" />
            </svg>
            <span class="text-[10px] font-semibold tracking-tight">Kuas</span>
          </button>

          <button class="tool-btn" data-tool="shape" id="shape-tool-btn">
            <svg class="w-4 h-4 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="8" height="8" rx="1.5" />
              <circle cx="17.5" cy="17.5" r="4.5" />
              <path d="M14 4l7 7" />
            </svg>
            <span class="text-[10px] font-semibold tracking-tight">Bentuk</span>
          </button>

          <button class="tool-btn" data-tool="text">
            <svg class="w-4 h-4 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 7 4 4 20 4 20 7" />
              <line x1="9" y1="20" x2="15" y2="20" />
              <line x1="12" y1="4" x2="12" y2="20" />
            </svg>
            <span class="text-[10px] font-semibold tracking-tight">Text</span>
          </button>

          <button class="tool-btn" id="add-sticky-btn" type="button">
            <svg class="w-4 h-4 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z" />
              <path d="M15 3v4a2 2 0 0 0 2 2h4" />
            </svg>
            <span class="text-[10px] font-semibold tracking-tight">Catatan</span>
          </button>

          <button class="tool-btn" id="color-menu-btn" type="button">
            <span id="active-color-dot" class="w-4 h-4 mb-0.5 rounded-full border-2 border-white shadow-sm" style="background-color: #111827;"></span>
            <span class="text-[10px] font-semibold tracking-tight">Warna</span>
          </button>

          <button class="tool-btn" data-tool="eraser">
            <svg class="w-4 h-4 mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21" />
              <path d="M22 21H7" />
              <path d="m5 11 9 9" />
            </svg>
            <span class="text-[10px] font-semibold tracking-tight">Hapus</span>
          </button>
        </div>

        <div class="h-6 w-[1px] bg-slate-800/15 shrink-0 mx-1"></div>

        <div class="flex items-center gap-2 pr-2 shrink-0 flex-1 max-w-[280px]">
          <span class="text-[11px] font-semibold text-slate-800 whitespace-nowrap">Ukuran</span>
          <input
            id="size-slider"
            type="range"
            min="1"
            max="48"
            value="4"
            class="w-full min-w-[75px]"
          />
          <div class="w-6 h-6 rounded-full bg-white/50 border border-white/80 flex items-center justify-center shrink-0">
            <span id="size-preview-dot" class="rounded-full bg-slate-900 block" style="width: 4px; height: 4px;"></span>
          </div>
          <span id="size-label" class="text-[11px] font-bold text-slate-800 w-8 text-right">4px</span>
        </div>

      </div>
    </div>
  </div>

  <!-- Script Eksternal & PWA Service Worker Registration -->
  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('ServiceWorker registered! Scope: ', reg.scope))
          .catch(err => console.log('ServiceWorker registration failed: ', err));
      });
    }
  </script>
</body>
</html>
